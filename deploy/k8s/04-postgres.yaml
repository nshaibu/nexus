---
#
# PostgreSQL StatefulSet for Volnux governance data.
# Stores: audit trail, asset catalog, approval chains, delegation records,
#         RBAC models, workflow metadata, asset materialisation history.
#
# Production note:
#   For production workloads consider a managed PostgreSQL offering:
#     AWS:   RDS PostgreSQL or Aurora PostgreSQL
#     GCP:   Cloud SQL for PostgreSQL
#     Azure: Azure Database for PostgreSQL
#   Managed offerings provide automated backups, point-in-time recovery,
#   read replicas, and automatic failover without operational overhead.
#   If using a managed database, remove this StatefulSet and update
#   the postgres-host in secrets.yaml to point to the managed endpoint.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: volnux
  labels:
    app: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: volnux
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/component: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9187"
    spec:
      # ── Security context ───────────────────────────────────────────────────
      securityContext:
        fsGroup:    999    # postgres group
        runAsUser:  999    # postgres user
        runAsGroup: 999
        runAsNonRoot: true

      # ── No preemption during backup windows ───────────────────────────────
      priorityClassName: system-cluster-critical

      containers:

        # ── PostgreSQL primary ───────────────────────────────────────────────
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: volnux-secrets
                  key: postgres-database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: volnux-secrets
                  key: postgres-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: volnux-secrets
                  key: postgres-password
            # PGDATA must point to a subdirectory, not the mount root.
            # The filesystem creates a lost+found directory in the root of
            # an EBS/PD volume which causes initdb to fail if PGDATA = root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Performance tuning for governance workloads
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=en_US.utf8"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu:    "1"
              memory: "2Gi"
            limits:
              cpu:    "4"
              memory: "8Gi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds:       15
            timeoutSeconds:      5
            failureThreshold:    3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds:       5
            timeoutSeconds:      3
            failureThreshold:    3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false  # PostgreSQL writes to PGDATA
            capabilities:
              drop: ["ALL"]

        # ── PostgreSQL Exporter sidecar (Prometheus metrics) ─────────────────
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@localhost:5432/$(POSTGRES_DB)?sslmode=disable"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: volnux-secrets
                  key: postgres-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: volnux-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: volnux-secrets
                  key: postgres-database
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "100m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot:             true
            runAsUser:                65534
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: postgres-config
          configMap:
            name: postgres-config
        - name: postgres-init
          configMap:
            name: postgres-init-scripts

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi

---
# PostgreSQL tuning configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: volnux
data:
  postgresql.conf: |
    # Connection settings
    max_connections = 200
    superuser_reserved_connections = 3

    # Memory settings — tune to 25% of container memory limit
    shared_buffers = 2GB
    effective_cache_size = 6GB
    work_mem = 16MB
    maintenance_work_mem = 256MB

    # WAL settings for durability
    wal_level = replica
    max_wal_size = 4GB
    min_wal_size = 1GB
    checkpoint_completion_target = 0.9
    synchronous_commit = on

    # Query planner
    random_page_cost = 1.1        # SSD storage
    effective_io_concurrency = 200

    # Logging
    log_min_duration_statement = 1000   # Log queries > 1s
    log_checkpoints = on
    log_connections = off
    log_disconnections = off
    log_lock_waits = on
    log_temp_files = 0

    # Auto-vacuum for governance tables with heavy INSERT workload
    autovacuum_vacuum_scale_factor = 0.05
    autovacuum_analyze_scale_factor = 0.02

---
# Initialisation scripts — run once on first startup
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: volnux
data:
  01-extensions.sql: |
    -- Extensions required by Volnux
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";    -- UUID generation
    CREATE EXTENSION IF NOT EXISTS "pg_trgm";      -- Trigram indexes for text search
    CREATE EXTENSION IF NOT EXISTS "btree_gin";    -- GIN indexes for composite queries

  02-configure.sql: |
    -- Per-database settings
    ALTER DATABASE volnux SET timezone = 'UTC';
    ALTER DATABASE volnux SET statement_timeout = '300s';

---
# ClusterIP service — used by all Volnux pods
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: volnux
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: metrics
      port: 9187
      targetPort: 9187

---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: volnux
spec:
  type:      ClusterIP
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

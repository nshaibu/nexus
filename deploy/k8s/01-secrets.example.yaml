---
#
# IMPORTANT: Copy this file to secrets.yaml and fill in real values.
#            secrets.yaml is gitignored — never commit it.
#
# This file uses `stringData` (plain text). Kubernetes base64-encodes
# stringData fields automatically. Do NOT manually base64-encode values
# — that produces double-encoded secrets.
#
# Generate a secure random value:
#   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
#
# Recommended secret management in production:
#   AWS:   AWS Secrets Manager + External Secrets Operator
#   GCP:   Secret Manager + External Secrets Operator
#   Azure: Key Vault + External Secrets Operator
#   Self:  Sealed Secrets (Bitnami)

apiVersion: v1
kind: Secret
metadata:
  name: volnux-secrets
  namespace: volnux
  labels:
    app: volnux
type: Opaque
stringData:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres-host:     "postgres.volnux.svc.cluster.local"
  postgres-port:     "5432"
  postgres-database: "volnux"
  postgres-username: "volnux"
  postgres-password: "REPLACE_WITH_SECURE_PASSWORD"

  # ── Redis — Checkpoints, HITL queue, command channel, task location ─────────
  # AOF persistence enabled — survives pod restarts
  redis-checkpoint-url: "redis://redis-checkpoints.volnux.svc.cluster.local:6379/0"

  # ── Redis — Celery broker for ScheduleTrigger ────────────────────────────────
  # noeviction policy — broker must not lose messages
  redis-broker-url: "redis://redis-broker.volnux.svc.cluster.local:6379/0"

  # ── JWT — REST API authentication ───────────────────────────────────────────
  jwt-secret-key: "REPLACE_WITH_SECURE_RANDOM_64_CHAR_STRING"

  # ── EventHub ─────────────────────────────────────────────────────────────────
  eventhub-api-key: "REPLACE_WITH_EVENTHUB_API_KEY"

  # ── HITL adapters ────────────────────────────────────────────────────────────
  slack-signing-secret:    "REPLACE_WITH_SLACK_SIGNING_SECRET"
  slack-webhook-url:       "https://hooks.slack.com/services/REPLACE"
  email-smtp-password:     "REPLACE_WITH_SMTP_PASSWORD"
  hitl-webhook-auth:       "REPLACE_WITH_WEBHOOK_AUTH_TOKEN"
  email-token-secret:      "REPLACE_WITH_EMAIL_TOKEN_SECRET"

  # ── Webhook trigger HMAC signing ─────────────────────────────────────────────
  webhook-default-secret: "REPLACE_WITH_WEBHOOK_HMAC_SECRET"

  # ── LLM providers (populate only those you use) ──────────────────────────────
  openai-api-key:    ""
  anthropic-api-key: ""
  gemini-api-key:    ""
  # Ollama is self-hosted — no API key required

  # ── gRPC TLS (for RemoteExecutor between nodes) ──────────────────────────────
  # Generate:
  #   openssl req -x509 -newkey rsa:4096 -keyout server.key \
  #     -out server.crt -days 365 -nodes -subj "/CN=volnux-worker"
  grpc-tls-cert: "REPLACE_WITH_BASE64_ENCODED_CERT"
  grpc-tls-key:  "REPLACE_WITH_BASE64_ENCODED_KEY"

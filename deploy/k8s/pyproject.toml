[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "volnux"
version     = "2.0.0"
description = "Workflow Operating System — governed, durable, agentic execution"
readme      = "README.md"
license     = { text = "Apache-2.0" }
requires-python = ">=3.11"

authors = [
    { name = "Volnux Contributors" },
]

keywords = [
    "workflow", "orchestration", "governance", "agentic-ai",
    "durable-execution", "hitl", "checkpointing",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
]

# ── Core dependencies (always installed) ──────────────────────────────────────
dependencies = [
    # Async HTTP client — Ollama adapter, WebhookTrigger
    "httpx>=0.27",
    # Fast JSON — governance model serialisation
    "orjson>=3.9",
    # OpenTelemetry
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    # REST API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # CLI
    "click>=8.1",
    "rich>=13",
    # Persistence base
    "aiosqlite>=0.20",
    # Scheduling
    "croniter>=2.0",
    # Pydantic for FastAPI models (not for Volnux core models — that is formax-py)
    "pydantic>=2.7",
]

# ── Optional dependency groups ─────────────────────────────────────────────────
[project.optional-dependencies]

postgres = [
    "asyncpg>=0.29",
    "yoyo-migrations>=8.2",
]

redis = [
    "redis[asyncio]>=5.0",
    "hiredis>=2.3",     # C parser — 5-10× faster Redis response parsing
]

grpc = [
    "grpcio>=1.63",
    "grpcio-tools>=1.63",
    "protobuf>=4.25",
]

celery = [
    "celery[redis]>=5.4",
    "kombu>=5.3",
]

kubernetes = [
    "kubernetes>=29",
]

openai = [
    "openai>=1.30",
]

anthropic = [
    "anthropic>=0.28",
]

gemini = [
    # New google-genai SDK (NOT deprecated google-generativeai)
    "google-genai>=0.7",
]

# Everything except LLM providers (included per provider as needed)
all = [
    "volnux[postgres,redis,grpc,celery,kubernetes]",
]

# Development tooling
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Test doubles
    "fakeredis>=2.23",
    "pytest-postgresql>=6",
    # Load testing
    "locust>=2.28",
]

docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

# ── Entry points ───────────────────────────────────────────────────────────────
[project.scripts]
volnux = "volnux.cli.base:main"

# ── Package discovery ──────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["."]
include = ["volnux*"]

[tool.setuptools.package-data]
volnux = ["py.typed", "**/*.pyi"]

# ── Ruff (linter + formatter) ──────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100
src            = ["volnux", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long — handled by formatter
    "B008",   # Function calls in default arguments — common in FastAPI
    "RUF012", # Mutable class attributes — EventBase uses ClassVar patterns
]

[tool.ruff.lint.isort]
known-first-party = ["volnux"]

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
strict                 = false
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true
exclude                = ["tests/", "docs/"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode  = "auto"
testpaths     = ["tests"]
log_cli       = true
log_cli_level = "WARNING"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit:        Pure unit tests — no infrastructure",
    "integration: Integration tests — requires running PostgreSQL and Redis",
    "agent:       Agent tests — requires Ollama or API key",
    "slow:        Tests that take > 5s",
    "benchmark:   Performance benchmark tests",
]

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source   = ["volnux"]
omit     = ["volnux/cli/*", "tests/*", "*/migrations/*"]
branch   = true

[tool.coverage.report]
show_missing   = true
skip_covered   = false
fail_under     = 80
exclude_lines  = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

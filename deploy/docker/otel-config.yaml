# deploy/docker/otel-config.yaml
# OTel Collector configuration for local development (Docker Compose).
# Mirrors the Kubernetes ConfigMap in 09-otel-collector.yaml.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval:         1s
    limit_percentage:       80
    spike_limit_percentage: 25
  batch:
    timeout:             5s
    send_batch_size:     256
    send_batch_max_size: 512
  resource:
    attributes:
      - action: insert
        key:    deployment.environment
        value:  development

exporters:
  # Tempo — receives traces
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Prometheus — exposes aggregated metrics for scraping
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion:
      enabled: true

  # Debug — prints spans to stdout in development
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [otlp/tempo, debug]
    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [prometheus]
  telemetry:
    logs:
      level: warn

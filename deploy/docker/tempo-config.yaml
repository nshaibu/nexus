# deploy/docker/tempo-config.yaml
# Minimal Tempo configuration for local development.

stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h   # Keep 2 days of traces locally

storage:
  trace:
    backend:        local
    local:
      path:         /var/tempo/traces
    wal:
      path:         /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator
  processors:
    - service-graphs
    - span-metrics
